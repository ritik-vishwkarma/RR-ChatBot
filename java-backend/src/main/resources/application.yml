spring:
  config:
    import: optional:file:./.env[.properties]

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5     # free Postgres tiers allow few connections
      minimum-idle: 0          # serverless DBs suspend when idle
      connection-timeout: 30000  # allow time for a suspended DB to wake


  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update

# server:
