server:
  port: ${PORT:8080}                    # hosts such as Render inject PORT
  forward-headers-strategy: framework   # real client IP + https behind the proxy
  shutdown: graceful

ai:
  webhook:
    url: ${AI_WEBHOOK_URL}
    secret: ${AI_WEBHOOK_SECRET}

security:
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:chatbot-api}
    access-seconds: 900
    refresh-seconds: 864000
app:
  cookies:
    secure: ${COOKIE_SECURE:true}
