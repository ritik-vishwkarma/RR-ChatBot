<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="login">
  <div class="panel">
    <h1>Sign in</h1>
    <p>Continue to your chats.</p>
    <p class="muted">Sign in with your email or create an account.</p>
    <form id="f" class="stack">
      <input id="email" type="email" placeholder="Email" autocomplete="username" required>
      <input id="pw" type="password" placeholder="Password (12+ characters)" autocomplete="current-password" minlength="12" maxlength="72" required>
      <div class="err" id="err" role="alert"></div>
      <button class="btn primary" type="submit">Sign in</button>
      <button class="btn" type="button" id="reg">Create account</button>
    </form>
  </div>
</main>
<script src="app.js"></script>
<script src="login.js"></script>
</body>
</html>
